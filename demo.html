<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sticky Wardrobe Demo</title>
  <style>
    /* ============ RESET ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ============ LANDING SECTION ============ */
    .landing-section {
      position: relative;
      /* 200vh to have enough space for a full scroll + after-section reveal */
      height: 200vh;
      background-color: #990036;
    }

    /* 
       1) The container is STICKY at top:0 and spans min-height:100vh. 
       2) It remains pinned until the user scrolls past its own height (100vh). 
       3) We center all child elements with flex.
    */
    .content-container {
      position: sticky;
      top: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px; /* spacing between items */
    }

    /* ============ WARDROBE PLACEHOLDER ============ */
    .wardrobe {
      width: 300px;
      height: 300px;
      background-color: #CA9921;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      /* We'll rotate this box from 180deg to 0deg in JS 
         (representing doors opening). */
      transform: rotateY(180deg); /* start closed */
      transition: transform 0.2s linear;
    }

    /* ============ BRAND TEXT ============ */
    .schrankgold-title {
      display: flex;
      justify-content: center;
    }

    .schrank {
      font-family: sans-serif; /* for demo; replace with your font */
      font-size: 48px; 
      color: #fff;
      margin-right: 8px;
    }

    .gold {
      font-family: sans-serif; /* for demo; replace with your font */
      font-size: 48px;
      color: #CA9921;
    }

    /* ============ SUBTITLE TEXT ============ */
    .best-second-subtitle {
      font-family: sans-serif; /* for demo; replace with your font */
      font-size: 36px;
      color: white;
      letter-spacing: 5px;

      /* Start hidden off-screen (translateY(100%)) + transparent */
      transform: translateY(100%);
      opacity: 0;

      transition: transform 0.5s ease-out, opacity 0.5s ease-out;
    }

    /* ============ AFTER SECTION ============ */
    .after-section {
      height: 100vh; 
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

  </style>
</head>
<body>

  <!-- LANDING SECTION (200vh) -->
  <div class="landing-section">

    <!-- STICKY CONTAINER (100vh) -->
    <div class="content-container">

      <!-- 1) Placeholder Wardrobe (rotates in JS) -->
      <div class="wardrobe" id="wardrobe">Wardrobe</div>

      <!-- 2) Brand text -->
      <div class="schrankgold-title">
        <span class="schrank">SCHRANK</span>
        <span class="gold">GOLD</span>
      </div>

      <!-- 3) Subtitle (slides in from bottom) -->
      <div class="best-second-subtitle" id="bestSecond">
        best second
      </div>

    </div> <!-- .content-container -->
  </div> <!-- .landing-section -->

  <!-- AFTER SECTION -->
  <div class="after-section">
    <p>This is content after the landing section.</p>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const landingSection = document.querySelector('.landing-section');
    const wardrobe = document.querySelector('#wardrobe');
    const bestSecond = document.querySelector('#bestSecond');

    // We'll animate from 0 to maxScroll = 100vh 
    // (since .landing-section is 200vh and .content-container is 100vh).
    function onScroll() {
      const sectionOffsetTop = landingSection.offsetTop;
      const sectionHeight = landingSection.offsetHeight; // 200vh in px
      const currentScrollY = window.scrollY;

      // maxScroll is (200vh - 100vh) = 100vh
      const maxScroll = sectionHeight - window.innerHeight; 
      // how far we've scrolled inside .landing-section
      const scrolledPx = currentScrollY - sectionOffsetTop;

      // clamp between 0 and maxScroll
      const clampedScroll = Math.min(Math.max(scrolledPx, 0), maxScroll);
      const scrollPercent = (maxScroll > 0) ? (clampedScroll / maxScroll) : 0;

      // 1) Rotate the wardrobe from 180° at top to 0° at bottom
      const rotation = 180 * (1 - scrollPercent);
      wardrobe.style.transform = `rotateY(${rotation}deg)`;

      // 2) Slide up "best second" between 30% and 50% of the scroll
      slideUpText(clampedScroll, maxScroll);
    }

    function slideUpText(scrolledPx, maxScroll) {
      // Let's say it appears from 30% to 50% of the scroll
      const start = 0.3 * maxScroll;
      const end   = 0.5 * maxScroll;

      if (scrolledPx <= start) {
        bestSecond.style.transform = 'translateY(100%)';
        bestSecond.style.opacity = '0';
      } 
      else if (scrolledPx >= end) {
        bestSecond.style.transform = 'translateY(0)';
        bestSecond.style.opacity = '1';
      } 
      else {
        const progress = (scrolledPx - start) / (end - start);
        const translateY = (1 - progress) * 100; 
        bestSecond.style.transform = `translateY(${translateY}%)`;
        bestSecond.style.opacity = progress;
      }
    }

    // Attach scroll listener
    window.addEventListener('scroll', onScroll);
    // Run once at load
    onScroll();
  });
  </script>

</body>
</html>
